<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up Quiz Platform</title><style>body{margin:0;background:#faf9f7;color:#24201d;font:16px/1.5 system-ui}main{max-width:460px;margin:7vh auto;padding:32px;background:#fff;border:1px solid #e3dfd9;border-top:4px solid #f48120}h1{font-size:30px;margin:0}p{color:#706a63}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;box-sizing:border-box;width:100%;padding:11px;border:1px solid #d9d4ce;border-radius:3px}button{margin-top:24px;background:#f48120;border-color:#f48120;cursor:pointer;font-weight:650}#status{color:#b42318}@media(max-width:520px){main{margin:24px 14px;padding:24px}}</style></head><body><main><h1 data-copy="title">Set up your quiz</h1><p data-copy="intro">Start with an empty question library. Create your quizzes after setup.</p><form id="setup"><label for="language" data-copy="language">Default language</label><select id="language" name="language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option></select><label for="siteName" data-copy="siteName">Site name</label><input id="siteName" name="siteName" maxlength="80" required value="Quiz Platform"><label for="password" data-copy="password">Admin password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><small data-copy="passwordHelp">Use 12–128 characters.</small><label for="confirm" data-copy="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button data-copy="complete">Complete setup</button></form><p id="status" role="status"></p></main><script>
const form=document.getElementById('setup'),status=document.getElementById('status'),language=document.getElementById('language');
const messages={
 en:{title:'Set up your quiz',intro:'Start with an empty question library. Create your quizzes after setup.',language:'Default language',siteName:'Site name',password:'Admin password',passwordHelp:'Use 12–128 characters.',confirm:'Confirm password',complete:'Complete setup',mismatch:'Passwords do not match.',unavailable:'Unable to reach the server.',failed:'Setup failed. Please try again.',invalid:'Enter a site name (1–80 characters) and a password of 12–128 characters.',limited:'Too many attempts. Try again in 15 minutes.',completed:'Setup is already complete. Please sign in.'},
 'zh-CN':{title:'设置你的答题平台',intro:'首次安装的题库为空，完成设置后即可创建题库。',language:'默认语言',siteName:'网站名称',password:'管理员密码',passwordHelp:'请使用 12–128 个字符。',confirm:'确认密码',complete:'完成设置',mismatch:'两次输入的密码不一致。',unavailable:'无法连接服务器。',failed:'设置失败，请重试。',invalid:'请输入网站名称（1–80 个字符）和密码（12–128 个字符）。',limited:'尝试次数过多，请在 15 分钟后重试。',completed:'已完成设置，请登录。'},
 'zh-TW':{title:'設定你的答題平台',intro:'首次安裝的題庫為空，完成設定後即可建立題庫。',language:'預設語言',siteName:'網站名稱',password:'管理員密碼',passwordHelp:'請使用 12–128 個字元。',confirm:'確認密碼',complete:'完成設定',mismatch:'兩次輸入的密碼不一致。',unavailable:'無法連線至伺服器。',failed:'設定失敗，請重試。',invalid:'請輸入網站名稱（1–80 個字元）和密碼（12–128 個字元）。',limited:'嘗試次數過多，請在 15 分鐘後重試。',completed:'已完成設定，請登入。'}
};
const text=()=>messages[language.value];
function localize(){document.documentElement.lang=language.value;document.title=text().title;document.querySelectorAll('[data-copy]').forEach(element=>element.textContent=text()[element.dataset.copy]);status.textContent='';}
language.addEventListener('change',localize);
fetch('/api/site').then(r=>{if(!r.ok)throw Error();return r.json();}).then(data=>{if(data.configured)location.replace('/admin');}).catch(()=>{status.textContent=text().unavailable;});
form.addEventListener('submit',async event=>{event.preventDefault();if(form.password.value!==document.getElementById('confirm').value){status.textContent=text().mismatch;return;}const button=form.querySelector('button');button.disabled=true;try{const response=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});if(!response.ok){status.textContent=response.status===409?text().completed:response.status===429?text().limited:response.status===400?text().invalid:text().failed;button.disabled=false;return;}location.replace('/admin');}catch(error){status.textContent=text().unavailable;button.disabled=false;}});
</script></body></html>
