<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up Quiz Platform</title><style>body{margin:0;background:#faf9f7;color:#24201d;font:16px/1.5 system-ui}main{max-width:460px;margin:7vh auto;padding:32px;background:#fff;border:1px solid #e3dfd9;border-top:4px solid #f48120}h1{font-size:30px;margin:0}p{color:#706a63}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;box-sizing:border-box;width:100%;padding:11px;border:1px solid #d9d4ce;border-radius:3px}button{margin-top:24px;background:#f48120;border-color:#f48120;cursor:pointer;font-weight:650}#status{color:#b42318}@media(max-width:520px){main{margin:24px 14px;padding:24px}}</style></head><body><main><h1>Set up your quiz</h1><p>Start with an empty question library. Create your quizzes after setup.</p><form id="setup"><label for="siteName">Site name</label><input id="siteName" name="siteName" maxlength="80" required value="Quiz Platform"><label for="language">Default language</label><select id="language" name="language"><option value="en">English</option><option value="zh-CN">简体中文</option></select><label for="setupKey">Installation key</label><input id="setupKey" name="setupKey" type="password" autocomplete="off" required><small>Use the SETUP_TOKEN you configured for this installation.</small><label for="password">Admin password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button>Complete setup</button></form><p id="status" role="status"></p></main><script>
const form=document.getElementById('setup'),status=document.getElementById('status');
fetch('/api/site').then(r=>r.json()).then(data=>{if(data.configured){location.replace('/admin');return;}if(!data.setupKeyConfigured){status.textContent='The installer must configure the SETUP_TOKEN deployment secret first.';form.querySelector('button').disabled=true;}}).catch(()=>{status.textContent='Unable to reach the server.';});
form.addEventListener('submit',async event=>{event.preventDefault();if(form.password.value!==document.getElementById('confirm').value){status.textContent='Passwords do not match.';return;}const button=form.querySelector('button');button.disabled=true;try{const response=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json();if(!response.ok)throw Error(data.error||'Setup failed');location.replace('/admin');}catch(error){status.textContent=error.message;button.disabled=false;}});
</script></body></html>
